net.bridge.bridge-nf-call-iptables  = 1
net.bridge.bridge-nf-call-ip6tables = 1
net.ipv4.ip_forward                 = 1

# 多数の controller-runtime ベースの operator が常駐するノードでは
# デフォルト値 (max_user_instances=128) では inotify インスタンスが枯渇し、
# 後から起動する Pod が "too many open files" で CrashLoop する
# (例: metallb 0.16 の frr-k8s-statuscleaner)。
fs.inotify.max_user_instances       = 8192
fs.inotify.max_user_watches         = 524288
