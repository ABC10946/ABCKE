---
- include_tasks: update_repo.yaml

- name: unhold kubeadm on Debian
  dpkg_selections:
    name: kubeadm
    selection: install
  when: ansible_os_family == "Debian"

- name: upgrade kubeadm on Debian
  apt:
    name: "kubeadm={{ k8s_debian_package_version }}"
    update_cache: yes
    allow_change_held_packages: yes
  when: ansible_os_family == "Debian"

- name: upgrade kubeadm on Fedora
  dnf:
    name: kubeadm
    state: latest
    update_cache: yes
    disable_excludes: kubernetes
  when: ansible_distribution == "Fedora"

- name: drain node
  command: "kubectl drain {{ ansible_hostname }} --ignore-daemonsets --delete-emptydir-data"
  delegate_to: k8s-master1.internal
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: logout iSCSI sessions after drain
  command: iscsiadm -m session --logout
  failed_when: false

- name: kubeadm upgrade node
  command: "kubeadm upgrade node"

# kubeadm upgrade node regenerates the control-plane static pod manifests from
# ClusterConfiguration, which reverts the etcd/scheduler/controller-manager
# scrape bind-address fixes below. Reapply them every time.
- include_role:
    name: etcd_config

- include_role:
    name: scheduler_controller_manager_config

- include_tasks: upgrade_kubelet_kubectl.yaml

- name: uncordon node
  command: "kubectl uncordon {{ ansible_hostname }}"
  delegate_to: k8s-master1.internal
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
